[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-rollover-guard"
dynamic = ["version"]
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "FeidaWang"}]
description = "Fail-safe, capability-gated Codex context rollover foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crg = "crg.cli:main"

[tool.setuptools.packages.find]
include = ["crg*"]

[project.urls]
Repository = "https://github.com/FeidaWang/Context-Rollover-Guard"

[tool.setuptools.dynamic]
version = {attr = "crg.__version__"}

[tool.setuptools.package-data]
crg = ["**/*.json"]
