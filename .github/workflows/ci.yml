name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Linux isolated network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: sudo unshare --net -- sudo -u "$(id -un)" -- "$(command -v python)" scripts/verify_offline.py --clean --network-policy=os
      - name: macOS inherited network denial
        if: runner.os == 'macOS'
        shell: bash
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)' "$(command -v python)" scripts/verify_offline.py --clean --network-policy=os
