name: Manual release verification (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify final artifacts without credentials or network
        shell: bash
        run: sudo unshare --net -- sudo -u "$(id -un)" -- "$(command -v python)" scripts/verify_offline.py --clean --network-policy=os
      - name: Record evidence scope
        run: echo 'Offline synthetic verification only. No Desktop/model/hook live compatibility claim. No artifacts uploaded or release published.'
